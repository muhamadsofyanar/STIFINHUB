services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      APP_NAME: "${APP_NAME:-STIFIn Mulia Marketing Hub}"
      APP_URL: "${APP_URL:-https://app.stifinmulia.com}"
      BUSINESS_WHATSAPP: "${BUSINESS_WHATSAPP:-081333362649}"
      APP_KEY: "${APP_KEY:-}"
      APP_ADMIN_EMAIL: "${APP_ADMIN_EMAIL:-admin@stifinmulia.com}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:-}"
      COOKIE_SECURE: "true"
      DATA_FILE: "/app/data/database.json"
      BACKUP_DIR: "/app/data/backups"
      BACKUP_INTERVAL_MINUTES: "${BACKUP_INTERVAL_MINUTES:-360}"
      BACKUP_RETENTION: "${BACKUP_RETENTION:-30}"
      TZ: "Asia/Jakarta"
      STIFIN_API_BASE: "${STIFIN_API_BASE:-https://apro.stifin.id/api}"
      STIFIN_BRANCH_CODE: "${STIFIN_BRANCH_CODE:-JML-CAB-62}"
      INTEGRATION_TIMEOUT_MS: "${INTEGRATION_TIMEOUT_MS:-15000}"
      STARSENDER_ENABLED: "${STARSENDER_ENABLED:-false}"
      STARSENDER_SEND_URL: "${STARSENDER_SEND_URL:-https://api.starsender.online/api/send}"
      STARSENDER_GROUPS_URL: "${STARSENDER_GROUPS_URL:-https://api.starsender.online/api/whatsapp/groups}"
      STARSENDER_GROUP_SEND_URL: "${STARSENDER_GROUP_SEND_URL:-https://api.starsender.online/api/send/grup}"
      STARSENDER_API_KEY: "${STARSENDER_API_KEY:-}"
      STARSENDER_AUTH_HEADER: "${STARSENDER_AUTH_HEADER:-Authorization}"
      STARSENDER_AUTH_SCHEME: "${STARSENDER_AUTH_SCHEME:-}"
      STARSENDER_WEBHOOK_SECRET: "${STARSENDER_WEBHOOK_SECRET:-}"
    volumes:
      - stifin_mulia_data:/app/data
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  stifin_mulia_data:
    name: stifin-mulia-growth-os-data
